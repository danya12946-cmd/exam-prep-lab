{% extends "base.html" %}
{% block title %}{{ progress }}{% endblock %}
{% block content %}
<h1>{{ attempt.topic_title_snapshot }}</h1>
<div class="progress" role="progressbar" aria-label="Прогресс теста">
  <div class="progress-bar" style="width: 50%"></div>
</div>
<p class="lead">{{ progress }}</p>
<div class="card">
  <div class="card-body">
    <h2 class="h5">{{ answer.question_text_snapshot }}</h2>
    <form method="post" action="{% url 'attempt_answer' attempt.pk %}">
      {% csrf_token %}
      {% for option in answer.options_snapshot %}
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="option_key" id="option-{{ forloop.counter }}" value="{{ option.key }}">
          <label class="form-check-label" for="option-{{ forloop.counter }}">{{ option.text }}</label>
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Ответить</button>
    </form>
  </div>
</div>
{% endblock %}
