<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Подготовка к экзамену{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f8fc; }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .9rem 1rem;
      border: 1px solid #dee2e6;
      border-radius: .75rem;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .quiz-option:hover { border-color: #0d6efd; background: #f1f5ff; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: .6rem .75rem;
      border: 1px solid #ced4da;
      border-radius: .5rem;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'home' %}">Exam Prep</a>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'topics' %}">Темы</a>
        {% if user.is_authenticated %}
          <a class="btn btn-outline-secondary btn-sm" href="{% url 'my_results' %}">Мои результаты</a>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button class="btn btn-outline-danger btn-sm" type="submit">Выйти</button>
          </form>
        {% else %}
          <a class="btn btn-outline-secondary btn-sm" href="{% url 'login' %}">Войти</a>
          <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Регистрация</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container mb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
