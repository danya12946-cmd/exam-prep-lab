{% extends "base.html" %}

{% block title %}Тест — Подготовка к экзамену{% endblock %}

{% block content %}
  <div class="mx-auto" style="max-width: 820px;">
    <div class="d-flex justify-content-between text-muted small mb-2">
      <span>{{ topic_name }}</span>
      <span>Вопрос {{ current }} из {{ total }}</span>
    </div>
    <div class="progress mb-4" role="progressbar" aria-label="Прогресс теста" aria-valuenow="{{ current }}" aria-valuemin="0" aria-valuemax="{{ total }}">
      <div class="progress-bar" style="width: {% widthratio current total 100 %}%"></div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">{{ question.text }}</h1>
        <form method="post">
          {% csrf_token %}
          <div class="vstack gap-2">
            {% for option in options %}
              <label class="quiz-option">
                <input class="form-check-input mt-0" type="radio" name="answer" value="{{ option.id }}" required>
                <span>{{ option.text }}</span>
              </label>
            {% endfor %}
          </div>
          <div class="d-flex justify-content-end mt-4">
            <button class="btn btn-primary px-4" type="submit">Ответить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
